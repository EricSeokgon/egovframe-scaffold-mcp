name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 릴리스 게이트(빌드 + 오프라인 테스트 + MCP 핸드셰이크)를 지원 범위 전체에서 실행한다.
  # engines(node >=22)와 Windows 경로(프로세스 트리 종료, 경로 구분자, .cmd 래퍼)를 함께 검증한다.
  gate:
    name: gate (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release gate (build + offline tests + handshake)
        run: npm run prepublishOnly

      - name: Dependency audit (runtime)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm audit --omit=dev --audit-level=high

  # 공식 저장소를 실제로 내려받는 통합 테스트는 한 환경에서만 실행한다(네트워크·시간 비용).
  integration:
    name: integration (official templates & components)
    needs: gate
    runs-on: ubuntu-latest
    env:
      # Maven 기본 설정은 502·500·504 를 재시도하지 않아 원격 저장소(maven.egovframe.go.kr)의 일시 장애 한 번에 job 이 떨어진다.
      # 이 job 의 모든 mvn 호출(테스트가 띄우는 것 포함)이 5xx 를 3초 간격으로 최대 5회 다시 받도록 한다.
      MAVEN_ARGS: >-
        -Daether.connector.http.retryHandler.serviceUnavailable=429,500,502,503,504
        -Daether.connector.http.retryHandler.count=5
        -Daether.connector.http.retryHandler.interval=3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Retry mvn on transient repository failures (5xx, connection reset)
        # MAVEN_ARGS 재시도보다 긴 원격 저장소 장애에 대비해, 테스트가 띄우는 mvn 전체를 30초·60초 뒤 다시 실행한다.
        run: |
          echo "REAL_MVN=$(command -v mvn)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/mvn-retry"
          ln -s "$GITHUB_WORKSPACE/scripts/mvn-retry.sh" "$RUNNER_TEMP/mvn-retry/mvn"
          echo "$RUNNER_TEMP/mvn-retry" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test (downloads official templates)
        run: npm run smoke

      - name: CRUD compile test (official simple-backend)
        run: npm run test:crud-integration
      - name: CRUD search SQL on HSQLDB (MySQL, PostgreSQL, Oracle syntax modes)
        run: npm run test:crud-search-live

      - name: Extended templates test (downloads official templates)
        run: npm run test:templates

      - name: Components assembly test (downloads egovframe-common-components)
        run: npm run test:components

      - name: Recipe transaction rollback (official template and components)
        run: npm run test:recipe-transaction

      - name: Catalog pin and archive verification (official v5.0.7)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test:catalog-sync-live
      - name: Migration rules exist in Maven repositories (eGovFrame repo, Central)
        run: npm run test:migration-rules-live
      - name: Migration apply then JDK 17 Maven compile
        run: npm run test:migrate-integration
      - name: Keep 5.x current (official web and boot-web parent 5.0.0 to 5.0.2, compile, dependency and grade change)
        run: npm run test:update-live
      - name: Restore the migration regression corpus (official common-components v3.10.0 / v4.3.2 partial trees)
        uses: actions/cache@v4
        with:
          path: .corpus-cache
          key: migration-corpus-${{ hashFiles('catalog/migration-corpus.json') }}
      - name: Migration regression corpus (diagnose, dry-run apply, dependency check, assessment grades)
        run: npm run test:migrate-corpus
      - name: Reassemble common components (git origin tag, verified v5.0.7 archive, patches, manifest)
        run: npm run test:reassemble-live
      - name: Migration rehearsal on the full official v4.3.2 tree (reassemble, apply, compile, align pom, compile)
        run: npm run test:rehearse-live
      - name: Offline bundle for air-gapped networks (real bundle, local OSV = online, tools with fetch blocked)
        run: npm run test:bundle-live
      - name: CLI assessment on the 4.3.2 corpus tree (grades into this job summary)
        run: node dist/index.js assess --project .corpus-cache/cc-4.3.2 --out cli-assessment.md --step-summary --fail-on migration:D || test $? -eq 2
      - name: Container and deployment files (hadolint, kubeconform, docker build and run, compose with MySQL)
        run: |
          curl -sSfL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-x86_64
          echo "6bf226944684f56c84dd014e8b979d27425c0148f61b3bd99bcc6f39e9dc5a47  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          curl -sSfL -o /tmp/kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  /tmp/kubeconform.tgz" | sha256sum -c -
          tar xzf /tmp/kubeconform.tgz -C /tmp kubeconform
          HADOLINT=/tmp/hadolint KUBECONFORM=/tmp/kubeconform npm run test:deploy-live
      - name: Multi-module and MSA templates (workspace, per-module checks, multi-service compose with Config, Eureka, Gateway, EgovBoard)
        run: HADOLINT=/tmp/hadolint KUBECONFORM=/tmp/kubeconform npm run test:workspace-live
      - name: Delivery package (official web template, manifest verify, diff against previous, offline bundle OSV)
        run: npm run test:delivery-live
      - name: Generated Jenkinsfile and .gitlab-ci.yml run on Jenkins LTS and gitlab-ci-local
        run: npm run test:ci-run-live
      - name: Secure coding weaknesses on official templates (pinned counts, SARIF schema)
        run: npm run test:secure-live
      - name: Generated supply-chain workflow passes actionlint
        run: |
          node -e 'import("./dist/index.js").then((m) => process.stdout.write(m.generateCiYaml("maven", "17", { secureCoding: true })))' > generated-ci.yml
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color generated-ci.yml
      - name: Dependency check with OSV lookup
        run: npm run test:dependencies-live
      - name: Resolved dependency tree and CycloneDX SBOM (Maven plugin, Gradle tree)
        run: npm run test:sbom-live
      - name: Network diagnosis against real hosts
        run: npm run test:network-live
      # drift 감시는 정보용이다 — upstream 새 태그·Maven 저장소 일시 장애가 릴리스를 막지 않게 실패해도 job 은 계속한다(경고·요약은 로그에 남음).
      - name: Catalog drift watch (runtime/components tags, parent versions, pinned pom sha256)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run test:catalog-drift-live
      - name: server.json validates against the MCP Registry (mcp-publisher validate)
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate

      - name: AI assembly test (downloads egovframe-ai-rag)
        run: npm run test:ai-assembly
