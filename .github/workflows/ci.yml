name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 릴리스 게이트(빌드 + 오프라인 테스트 + MCP 핸드셰이크)를 지원 범위 전체에서 실행한다.
  # engines(node >=18)와 Windows 경로(프로세스 트리 종료, 경로 구분자, .cmd 래퍼)를 함께 검증한다.
  gate:
    name: gate (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release gate (build + offline tests + handshake)
        run: npm run prepublishOnly

      - name: Dependency audit (runtime)
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        run: npm audit --omit=dev --audit-level=high

  # 공식 저장소를 실제로 내려받는 통합 테스트는 한 환경에서만 실행한다(네트워크·시간 비용).
  integration:
    name: integration (official templates & components)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test (downloads official templates)
        run: npm run smoke

      - name: CRUD compile test (official simple-backend)
        run: npm run test:crud-integration

      - name: Extended templates test (downloads official templates)
        run: npm run test:templates

      - name: Components assembly test (downloads egovframe-common-components)
        run: npm run test:components

      - name: Recipe transaction rollback (official template and components)
        run: npm run test:recipe-transaction

      - name: Catalog pin and archive verification (official v5.0.6)
        run: npm run test:catalog-sync-live

      - name: AI assembly test (downloads egovframe-ai-rag)
        run: npm run test:ai-assembly
